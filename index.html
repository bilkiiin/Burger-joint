<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бургерная</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header__container">
            <img src="image/logo.svg" alt="Vintage Food Logo" class="logo">
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="#">Главная</a></li>
                    <li><a href="#">Акции</a></li>
                    <li><a href="#">О нас</a></li>
                </ul>
            </nav>
            <button class="cart">
                <img src="image/cart.svg" alt="Cart">
            </button>   
        </div>
    </header>

    <main class="main">
        <section class="lead"> 
            <div class="hero__container"> 
                <h1>Быстрая доставка для Вас</h1>
                <p>Сделай первый заказ и получи скидку 50%!</p>
                <button class="order-button">Заказать</button>
            </div>
            <img src="image/Фото _Бургер_.png" alt="Delicious Burger" class="main__image">
        </section>

        <section class="intro"></section>

        <section class="places">
            <h2 class="menu__title">Меню</h2>  
            <div class="menu__grid">
                <div class="menu__item"><img src="image/Картинка _Бургеры_.png" alt="Бургеры"><p>Бургеры</p></div>
                <div class="menu__item"><img src="image/Картинка _Блюда из курицы_.png" alt="Курица"><p>Блюда из курицы</p></div>
                <div class="menu__item"><img src="image/Картинка _Горячие блюда_.png" alt="Горячее"><p>Горячие блюда</p></div>
                <div class="menu__item"><img src="image/Картинка _Закуски_.png" alt="Закуски"><p>Закуски</p></div>
                <div class="menu__item"><img src="image/Картинка _Салаты_.png" alt="Салаты"><p>Салаты</p></div>
                <div class="menu__item"><img src="image/Картинка _Десерты_.png" alt="Десерты"><p>Десерты</p></div>
            </div>
        </section>

        <section class="video"></section>
        <section class="cover"></section>
    </main>

    <footer class="footer">
        <div class="footer__container">
            <nav class="footer__nav">
                <a href="#">Программа лояльности</a>
                <a href="#">Политика конфиденциальности</a>
                <a href="#">Договор оферты</a>
            </nav>
            <div class="footer__copy">
                <p>ООО «Vintage Food»</p>
                <p>© Все права защищены</p>
            </div>
            <div class="footer__socials">
                <a href="#"><img src="image/VK Circled.svg" alt="VK"></a>
                <a href="#"><img src="image/Telegram.svg" alt="Telegram"></a>
            </div>
        </div>
    </footer>
</body>
</html>
